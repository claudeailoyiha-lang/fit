name: Build FitEmpire APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare and Build FitEmpire APK
        run: |
          for z in *.zip; do unzip -q "$z" -d extracted; done
          flutter create --org uz.fitempire --project-name fitempire --platforms android fitempire_build
          cp extracted/FitEmpire_mobile/lib/main.dart fitempire_build/lib/main.dart
          cp -r extracted/FitEmpire_mobile/android/app/src/main/res/mipmap-* fitempire_build/android/app/src/main/res/
          sed -i 's/android:label="fitempire"/android:label="FitEmpire"/g' fitempire_build/android/app/src/main/AndroidManifest.xml
          cd fitempire_build
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../FitEmpire.apk

      - name: Upload FitEmpire APK
        uses: actions/upload-artifact@v4
        with:
          name: FitEmpire-Tayyor-APK
          path: FitEmpire.apk
